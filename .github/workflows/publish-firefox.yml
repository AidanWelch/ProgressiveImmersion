name: Publish Firefox

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Zip source code
        run: git archive --format zip --output ./source.zip HEAD

      - name: Install dependencies
        run: npm install

      - name: Build v2
        run: npm run build-v2

      - name: Publish to Firefox Addon Store
        uses: wdzeng/firefox-addon@v1
        with:
          addon-guid: ${{ secrets.FIREFOX_ADDON_ID }}
          xpi-path: 'web-ext-artifacts/progressiveimmersion_v2.zip'
          source-file-path: 'source.zip'
          self-hosted: false
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
